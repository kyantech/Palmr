[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = []

[licenses]
version = 2
allow = [
    "AGPL-3.0-only",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.93
unused-allowed-license = "allow"

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
deny = [
    { crate = "openssl", reason = "rustls everywhere; OpenSSL-backed TLS is rejected (ARCHITECTURE §3.2, §3.3)" },
    { crate = "openssl-sys", reason = "rustls everywhere; OpenSSL-backed TLS is rejected (ARCHITECTURE §3.2, §3.3)" },
    { crate = "bcrypt", reason = "Argon2id only; no bcrypt in the graph (ADR 0020, ARCHITECTURE §3.2)" },
    { crate = "diesel", reason = "sqlx is the SQLite driver (ARCHITECTURE §3.2, §3.3)" },
    { crate = "sea-orm", reason = "sqlx is the SQLite driver (ARCHITECTURE §3.2, §3.3)" },
    { crate = "rusqlite", reason = "sqlx is the SQLite driver (ARCHITECTURE §3.2, §3.3)" },
    { crate = "actix-web", reason = "Axum is the HTTP framework (ARCHITECTURE §3.2, §3.3)" },
    { crate = "rocket", reason = "Axum is the HTTP framework (ARCHITECTURE §3.2, §3.3)" },
    { crate = "rust-s3", reason = "aws-sdk-s3 is the S3 client (ARCHITECTURE §3.2, §3.3)" },
    { crate = "redis", reason = "Redis is explicitly absent (ARCHITECTURE §3.3, AGENTS.md)" },

    { crate = "chrono", wrappers = [], reason = "use `time` 0.3 (ARCHITECTURE §3.2, §3.3)" },
    { crate = "eyre", wrappers = [], reason = "use `anyhow` at process edges (ARCHITECTURE §3.2, §3.3)" },
    { crate = "axum-login", wrappers = [], reason = "Palmr owns its session model (ARCHITECTURE §3.3)" },
    { crate = "aide", wrappers = [], reason = "use utoipa (ARCHITECTURE §3.2, §3.3)" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
