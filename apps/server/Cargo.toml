[package]
name = "palmr-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "palmr"
path = "src/main.rs"

[dependencies]
anyhow = "1"
axum = { version = "0.8", default-features = false, features = ["matched-path", "tokio"] }
clap = { version = "4", features = ["derive"] }
figment = { version = "0.10", default-features = false }
http = "1"
getrandom = "0.4"
http-body-util = "0.1"
ipnet = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
time = { version = "0.3", default-features = false, features = ["std", "formatting", "parsing", "macros"] }
tokio = { version = "1", default-features = false, features = ["time"] }
tower = { version = "0.5", default-features = false, features = ["util"] }
tower-http = { version = "0.6", default-features = false, features = ["catch-panic", "compression-br", "compression-gzip", "decompression-br", "decompression-gzip"] }
tracing = { version = "0.1", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3", default-features = false, features = ["ansi", "env-filter", "fmt", "std"] }
url = "2"
utoipa = "5"
utoipa-axum = "0.2"
uuid = { version = "1", default-features = false, features = ["std", "v7"] }

[lints]
workspace = true

[dev-dependencies]
insta = "1"
proptest = { version = "1", default-features = false, features = ["std"] }
rstest = "0.27"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt", "test-util"] }
