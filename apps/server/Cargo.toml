[package]
name = "palmr-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "palmr"
path = "src/main.rs"

[dependencies]
anyhow = "1"
argon2 = { version = "0.5", default-features = false, features = ["alloc", "password-hash"] }
async-trait = "0.1"
aws-sdk-s3 = { version = "1", default-features = false, features = ["behavior-version-latest", "http-1x", "rt-tokio"] }
aws-smithy-runtime-api = { version = "1", default-features = false, features = ["client", "http-1x"] }
aws-smithy-types = { version = "1", default-features = false, features = ["http-body-1-x"] }
axum = { version = "0.8", default-features = false, features = ["http1", "matched-path", "tokio"] }
base64ct = { version = "1", features = ["alloc"] }
bytes = "1"
chacha20poly1305 = { version = "0.10", default-features = false, features = ["alloc"] }
clap = { version = "4", features = ["derive"] }
figment = { version = "0.10", default-features = false }
futures-core = { version = "0.3", default-features = false }
futures-util = { version = "0.3", default-features = false, features = ["alloc"] }
hkdf = "0.13"
hmac = "0.13"
http = "1"
http-body = "1"
getrandom = "0.4"
http-body-util = "0.1"
hyper = { version = "1", default-features = false, features = ["client", "http1", "http2"] }
hyper-rustls = { version = "0.27", default-features = false, features = ["http1", "http2", "ring", "tls12"] }
hyper-util = { version = "0.1", default-features = false, features = ["client-legacy", "http1", "http2", "tokio"] }
ipnet = "2"
mime_guess = { version = "2", default-features = false }
minijinja = { version = "2.24", default-features = false, features = ["multi_template"] }
rust-embed = { version = "8", features = ["debug-embed"] }
rustix = { version = "1", features = ["fs", "process"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pki-types = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
subtle = "2"
thiserror = "2"
time = { version = "0.3", default-features = false, features = ["std", "formatting", "parsing", "macros"] }
tokio = { version = "1", default-features = false, features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = { version = "0.7", default-features = false, features = ["io-util"] }
tower = { version = "0.5", default-features = false, features = ["util"] }
tower-http = { version = "0.6", default-features = false, features = ["catch-panic", "compression-br", "compression-gzip", "decompression-br", "decompression-gzip"] }
tracing = { version = "0.1", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3", default-features = false, features = ["ansi", "env-filter", "fmt", "std"] }
unicode-normalization = "0.1"
unicode-segmentation = "1"
url = "2"
utoipa = "5"
utoipa-axum = "0.2"
utoipa-scalar = { version = "0.3", default-features = false }
uuid = { version = "1", default-features = false, features = ["std", "v7"] }
webpki-roots = "1"
zeroize = "1"
sqlx = { version = "0.8", default-features = false, features = ["macros", "migrate", "runtime-tokio", "sqlite"] }
arc-swap = "1"
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "tokio1-rustls-tls", "hostname"] }
governor = { version = "0.8", default-features = false, features = ["std"] }

[features]
dev-assets = []
openapi-export = []

[lints]
workspace = true

[dev-dependencies]
insta = "1"
proptest = { version = "1", default-features = false, features = ["std"] }
rand = { version = "0.9", default-features = false, features = ["std_rng"] }
reqwest = { version = "0.12", default-features = false, features = ["cookies"] }
rstest = "0.27"
rustls = { version = "0.23", default-features = false, features = ["std", "ring", "tls12"] }
similar = "2"
tempfile = "3"
testcontainers = "0.28"
tl = "0.7"
tokio = { version = "1", features = ["io-util", "macros", "rt", "test-util"] }
