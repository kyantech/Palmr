services:
  palmr:
    image: ${PALMR_CONTAINER_IMAGE:-palmr-container-smoke:local}
    pull_policy: never
    environment:
      PALMR_BASE_URL: ${PALMR_E2E_BASE_URL:-http://127.0.0.1:5487}
    ports:
      - "127.0.0.1:${PALMR_E2E_PORT:-5487}:5487"
      - "127.0.0.1:9100:9100"
    volumes:
      - palmr-data:/data

  mock-idp:
    image: ${PALMR_E2E_IDP_IMAGE:-node:24-bookworm-slim}
    pull_policy: never
    network_mode: "service:palmr"
    command: ["node", "/tmp/mock-idp-server.mjs"]
    environment:
      MOCK_IDP_PORT: "9100"

  smtp-sink:
    image: ${PALMR_E2E_SINK_IMAGE:-axllent/mailpit:v1.29.1}
    pull_policy: never
    ports:
      - "127.0.0.1:${PALMR_E2E_SINK_PORT:-8025}:8025"

  data-seed:
    image: ${PALMR_E2E_SEED_IMAGE:-busybox:1.37.0-musl}
    pull_policy: never
    user: "0"
    entrypoint: ["sh", "-c"]
    command: ["true"]
    volumes:
      - palmr-data:/data

volumes:
  palmr-data:
