name: Nightly

on:
  schedule:
    - cron: "0 2 * * *"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  full-regression:
    name: Full regression
    if: false
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - run: echo "Full regression suite is not implemented yet" && exit 1

  browser-matrix:
    name: Browser matrix
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @palmr/e2e exec playwright install --with-deps chromium firefox webkit
      - run: PALMR_CONTAINER_REQUIRED=1 ./tests/container/smoke.sh
      - run: pnpm --filter @palmr/e2e test:container --grep e2e_shell_loads

  proxy-matrix:
    name: Proxy matrix
    if: false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - run: echo "Proxy matrix is not implemented yet" && exit 1

  storage-matrix:
    name: Storage matrix
    if: false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - run: echo "Storage matrix is not implemented yet" && exit 1

  stress:
    name: Stress
    if: false
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - run: echo "Stress suite is not implemented yet" && exit 1

  chaos:
    name: Chaos
    if: false
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - run: echo "Chaos suite is not implemented yet" && exit 1

  container:
    name: Container
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: PALMR_CONTAINER_REQUIRED=1 ./tests/container/smoke.sh
